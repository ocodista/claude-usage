          </div>

          {/* Progress indicators */}
          <div className="mt-6 p-4 rounded-lg" style={{ background: COLORS.surface2 }}>
            <h4 className="text-sm font-medium mb-4" style={{ color: COLORS.text }}>Session Progress</h4>
            <div className="space-y-3">
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span style={{ color: COLORS.textMuted }}>Message Position</span>
                  <span style={{ color: COLORS.text }}>{selectedIndex + 1} of {timeline.length}</span>
                </div>
                <div className="h-2 rounded-full overflow-hidden" style={{ background: COLORS.surface3 }}>
                  <div
                    className="h-full rounded-full transition-all"
                    style={{
                      width: `${((selectedIndex + 1) / timeline.length) * 100}%`,
                      background: `linear-gradient(90deg, ${COLORS.coral}, ${COLORS.amber})`
                    }}
                  />
                </div>
              </div>
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span style={{ color: COLORS.textMuted }}>Token Usage</span>
                  <span style={{ color: COLORS.text }}>{formatNumber(point.totalTokens)} of {formatNumber(session.totalTokens)}</span>
                </div>
                <div className="h-2 rounded-full overflow-hidden" style={{ background: COLORS.surface3 }}>
                  <div
                    className="h-full rounded-full transition-all"
                    style={{
                      width: `${(point.totalTokens / session.totalTokens) * 100}%`,
                      background: `linear-gradient(90deg, ${COLORS.blue}, ${COLORS.purple})`
                    }}
                  />
                </div>
              </div>
            </div>
          </div>

          {/* Navigation */}
          <div className="flex justify-between mt-6 pt-4 border-t" style={{ borderColor: COLORS.borderSubtle }}>

              onClick={() => onClose(selectedIndex - 1)}
              disabled={selectedIndex === 0}
              className="flex items-center gap-2 px-4 py-2 rounded-lg transition-colors disabled:opacity-30"
              style={{ background: COLORS.surface3, color: COLORS.text }}

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="15 18 9 12 15 6"/>

              onClick={() => onClose(selectedIndex + 1)}

              style={{ background: COLORS.surface3, color: COLORS.text }}
            >
              Next
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"/>

    };

    // Session Growth Chart - Shows token evolution within a session
    const SessionGrowth = ({ sessions }) => {
      const sessionsWithTimeline = useMemo(() => {
        return sessions.filter(s => s.tokenTimeline && s.tokenTimeline.length > 1);
      }, [sessions]);

      const [selectedSessionId, setSelectedSessionId] = useState(null);
      const [selectedMessageIndex, setSelectedMessageIndex] = useState(null);

      // Auto-select current session or first available
      useEffect(() => {
        if (!selectedSessionId && sessionsWithTimeline.length > 0) {
          const current = sessionsWithTimeline.find(s => s.isCurrentSession);
          setSelectedSessionId(current?.sessionId || sessionsWithTimeline[0].sessionId);
        }
      }, [sessionsWithTimeline, selectedSessionId]);

      const selectedSession = useMemo(() => {
        return sessionsWithTimeline.find(s => s.sessionId === selectedSessionId);
      }, [sessionsWithTimeline, selectedSessionId]);

      const handleChartClick = useCallback((params) => {
        if (params.dataIndex !== undefined && selectedSession?.tokenTimeline) {
          setSelectedMessageIndex(params.dataIndex);
        }
      }, [selectedSession]);

      const handleModalClose = useCallback((newIndex) => {
        if (typeof newIndex === 'number' && selectedSession?.tokenTimeline) {
          if (newIndex >= 0 && newIndex < selectedSession.tokenTimeline.length) {
            setSelectedMessageIndex(newIndex);
          } else {
            setSelectedMessageIndex(null);
          }
        } else {
          setSelectedMessageIndex(null);
        }
      }, [selectedSession]);

      const option = useMemo(() => {
        if (!selectedSession || !selectedSession.tokenTimeline) {
          return {
            backgroundColor: 'transparent',
            graphic: {
              type: 'text',
              left: 'center',
              top: 'middle',
              style: { text: 'No session data available', fill: COLORS.textMuted, fontSize: 14 }
            }
          };
        }

        const timeline = selectedSession.tokenTimeline;

        // Calculate per-message deltas for a stacked area view
        const inputDeltas = [];
        const outputDeltas = [];
        let prevInput = 0;
        let prevOutput = 0;

        timeline.forEach((point, i) => {
          inputDeltas.push(point.inputTokens - prevInput);
          outputDeltas.push(point.outputTokens - prevOutput);
          prevInput = point.inputTokens;
          prevOutput = point.outputTokens;
        });

        // Format time labels
        const timeLabels = timeline.map((t, i) => {
          const d = new Date(t.timestamp);
          return `#${i + 1}`;
        });

        return {
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'axis',
            backgroundColor: COLORS.surface2,
            borderColor: COLORS.border,
            textStyle: { color: COLORS.text },
            formatter: (params) => {
              const idx = params[0].dataIndex;
              const point = timeline[idx];
              const time = new Date(point.timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit'
              });
              let result = `<div style="font-weight:600;margin-bottom:8px">Message ${idx + 1} <span style="color:${COLORS.textMuted};font-weight:400">${time}</span></div>`;
              result += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
                <span style="width:8px;height:8px;border-radius:50%;background:${COLORS.amber}"></span>
                <span style="color:${COLORS.textSecondary}">Total:</span>
                <span style="font-weight:500">${formatNumber(point.totalTokens)}</span>
              </div>`;
              result += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
                <span style="width:8px;height:8px;border-radius:50%;background:${COLORS.purple}"></span>
                <span style="color:${COLORS.textSecondary}">Output:</span>
                <span style="font-weight:500">${formatNumber(point.outputTokens)}</span>
                <span style="color:${COLORS.textMuted}">(+${formatNumber(outputDeltas[idx])})</span>
              </div>`;
              result += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
                <span style="width:8px;height:8px;border-radius:50%;background:${COLORS.blue}"></span>
                <span style="color:${COLORS.textSecondary}">Input:</span>
                <span style="font-weight:500">${formatNumber(point.inputTokens)}</span>
                <span style="color:${COLORS.textMuted}">(+${formatNumber(inputDeltas[idx])})</span>
              </div>`;
              result += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid ${COLORS.border};font-size:11px;color:${COLORS.textMuted}">Click for details</div>`;
              return result;
            }
          },
          legend: {
            data: ['Total', 'Output', 'Input'],
            textStyle: { color: COLORS.textMuted, fontSize: 11 },
            bottom: 0,
            itemWidth: 12,
            itemHeight: 8
          },
          grid: { left: 50, right: 15, top: 15, bottom: 40 },
          xAxis: {
            type: 'category',
            data: timeLabels,
            axisLine: { lineStyle: { color: COLORS.borderSubtle } },
            axisLabel: {
              color: COLORS.textMuted,
              fontSize: 10,
              interval: Math.max(0, Math.floor(timeline.length / 10) - 1)
            },
            axisTick: { show: false },
            triggerEvent: true
          },
          yAxis: {
            type: 'value',
            axisLine: { show: false },
            splitLine: { lineStyle: { color: COLORS.borderSubtle } },
            axisLabel: { color: COLORS.textMuted, fontSize: 10, formatter: (v) => formatNumber(v) }
          },
          series: [
            {
              name: 'Total',
              type: 'line',
              smooth: true,
              symbol: 'circle',
              symbolSize: 6,
              showSymbol: timeline.length < 50,
              lineStyle: { width: 2, color: COLORS.amber },
              itemStyle: { color: COLORS.amber },
              areaStyle: { opacity: 0.08, color: COLORS.amber },
              emphasis: {
                scale: true,
                itemStyle: { color: COLORS.coral, borderColor: '#fff', borderWidth: 2 }
              },
              data: timeline.map(t => t.totalTokens)
            },
            {
              name: 'Output',
              type: 'line',
              smooth: true,
              symbol: 'circle',
              symbolSize: 4,
              showSymbol: timeline.length < 50,
              lineStyle: { width: 2, color: COLORS.purple },
              itemStyle: { color: COLORS.purple },
              emphasis: {
                scale: true,
                itemStyle: { borderColor: '#fff', borderWidth: 2 }
              },
              data: timeline.map(t => t.outputTokens)
            },
            {
              name: 'Input',
              type: 'line',
              smooth: true,
              symbol: 'circle',
              symbolSize: 4,
              showSymbol: timeline.length < 50,
              lineStyle: { width: 2, color: COLORS.blue },
              itemStyle: { color: COLORS.blue },
              emphasis: {
                scale: true,
                itemStyle: { borderColor: '#fff', borderWidth: 2 }
              },
              data: timeline.map(t => t.inputTokens)
            }
          ]
        };
      }, [selectedSession]);

      if (sessionsWithTimeline.length === 0) {
        return (
          <div className="flex items-center justify-center h-48" style={{ color: COLORS.textMuted }}>
            No session timeline data available
          </div>
        );
      }

      const projectName = selectedSession?.project.split('/').pop() || 'Unknown';

      return (
        <div>
          {/* Session Selector */}
          <div className="flex items-center justify-between mb-4">
            <select
              value={selectedSessionId || ''}
              onChange={(e) => setSelectedSessionId(e.target.value)}
              className="text-sm px-3 py-1.5 rounded-lg border appearance-none cursor-pointer"
              style={{
                background: COLORS.surface2,
                borderColor: COLORS.border,
                color: COLORS.text,
                minWidth: 200
              }}
            >
              {sessionsWithTimeline.map(s => {
                const name = s.project.split('/').pop() || 'Unknown';
                const date = new Date(s.lastActivity).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                return (
                  <option key={s.sessionId} value={s.sessionId}>
                    {name} ({date}) - {s.tokenTimeline?.length || 0} msgs
                    {s.isCurrentSession ? ' ★' : ''}
                  </option>
                );
              })}
            </select>
            {selectedSession && (
              <div className="flex items-center gap-3 text-xs" style={{ color: COLORS.textMuted }}>
                <span>{getModelDisplayName(selectedSession.model)}</span>
                <span>{formatNumber(selectedSession.totalTokens)} tokens</span>
                {selectedSession.isCurrentSession && (
                  <span className="flex items-center gap-1" style={{ color: COLORS.green }}>
                    <span className="w-1.5 h-1.5 rounded-full pulse" style={{ background: COLORS.green }} />
                    Live
                  </span>
                )}
              </div>
            )}
          </div>
          <div className="text-xs mb-2" style={{ color: COLORS.textMuted }}>
            💡 Click on any point to see detailed breakdown
          </div>
          <Chart option={option} height={260} onClick={handleChartClick} />

          {/* Modal for message detail */}
          <Modal isOpen={selectedMessageIndex !== null} onClose={() => setSelectedMessageIndex(null)}>
            {selectedSession && selectedMessageIndex !== null && selectedSession.tokenTimeline && (
              <MessageSectionDetail
                session={selectedSession}
                selectedIndex={selectedMessageIndex}
                timeline={selectedSession.tokenTimeline}
                onClose={handleModalClose}
              />
            )}
          </Modal>
        </div>
      );
    };

    // Session Detail Page - Shows per-message token breakdown
    const SessionDetailPage = ({ sessionId, onBack }) => {
      const [sessionDetail, setSessionDetail] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedMessage, setSelectedMessage] = useState(null);

      useEffect(() => {
        async function fetchSessionDetail() {
          setLoading(true);
          setError(null);
          try {
            const res = await fetch(`/api/session/${sessionId}`);
            if (!res.ok) throw new Error('Session not found');
            const data = await res.json();
            setSessionDetail(data);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        if (sessionId) fetchSessionDetail();
      }, [sessionId]);

      // Context growth chart
      const contextChartOption = useMemo(() => {
        if (!sessionDetail?.messages) return null;

        const assistantMsgs = sessionDetail.messages.filter(m => m.type === 'assistant' && m.cumulativeTotal > 0);
        if (assistantMsgs.length === 0) return null;

        return {
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'axis',
            backgroundColor: COLORS.surface2,
            borderColor: COLORS.border,
            textStyle: { color: COLORS.text },
            formatter: (params) => {
              const idx = params[0].dataIndex;
              const msg = assistantMsgs[idx];
              return `<div style="font-weight:600;margin-bottom:8px">Message #${msg.index + 1}</div>
                <div>Context: ${formatNumber(msg.cumulativeInput)}</div>
                <div>Output: ${formatNumber(msg.cumulativeOutput)}</div>
                <div style="color:${COLORS.amber}">Total: ${formatNumber(msg.cumulativeTotal)}</div>`;
            }
          },
          grid: { left: 60, right: 20, top: 30, bottom: 40 },
          legend: {
            data: ['Context (Input)', 'Output', 'Total'],
            textStyle: { color: COLORS.textMuted, fontSize: 11 },
            top: 0
          },
          xAxis: {
            type: 'category',
            data: assistantMsgs.map(m => `#${m.index + 1}`),
            axisLine: { lineStyle: { color: COLORS.borderSubtle } },
            axisLabel: { color: COLORS.textMuted, fontSize: 10, interval: Math.max(0, Math.floor(assistantMsgs.length / 15)) }
          },
          yAxis: {
            type: 'value',
            name: 'Tokens',
            nameTextStyle: { color: COLORS.textMuted, fontSize: 10 },
            axisLine: { show: false },
            splitLine: { lineStyle: { color: COLORS.borderSubtle } },
            axisLabel: { color: COLORS.textMuted, fontSize: 10, formatter: v => formatNumber(v) }
          },
          series: [
            {
              name: 'Context (Input)',
              type: 'line',
              smooth: true,
              symbol: 'circle',
              symbolSize: 4,
              showSymbol: assistantMsgs.length < 50,
              lineStyle: { width: 2, color: COLORS.blue },
              itemStyle: { color: COLORS.blue },
              areaStyle: { opacity: 0.1, color: COLORS.blue },
              data: assistantMsgs.map(m => m.cumulativeInput)
            },
            {
              name: 'Output',
              type: 'line',
              smooth: true,
              symbol: 'circle',
              symbolSize: 4,
              showSymbol: assistantMsgs.length < 50,
              lineStyle: { width: 2, color: COLORS.purple },
              itemStyle: { color: COLORS.purple },
              data: assistantMsgs.map(m => m.cumulativeOutput)
            },
            {
              name: 'Total',
              type: 'line',
              smooth: true,
              symbol: 'circle',
              symbolSize: 4,
              showSymbol: assistantMsgs.length < 50,
              lineStyle: { width: 2, color: COLORS.amber },
              itemStyle: { color: COLORS.amber },
              data: assistantMsgs.map(m => m.cumulativeTotal)
            }
          ]
        };
      }, [sessionDetail]);

      if (loading) {
        return (
          <div className="flex items-center justify-center h-64">
            <div className="text-center">
              <div className="animate-spin w-8 h-8 border-2 rounded-full mx-auto mb-4" style={{ borderColor: COLORS.coral, borderTopColor: 'transparent' }}></div>
              <p style={{ color: COLORS.textMuted }}>Loading session details...</p>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="card p-8 text-center">
            <div className="mb-4" style={{ color: COLORS.coral }}>{Icons.info}</div>
            <p style={{ color: COLORS.text }}>Error: {error}</p>
            <button onClick={onBack} className="mt-4 px-4 py-2 rounded-lg" style={{ background: COLORS.surface3, color: COLORS.text }}>
              Go Back
            </button>
          </div>
        );
      }

      if (!sessionDetail) return null;

      const projectName = sessionDetail.project.split('/').pop() || 'Unknown';
      const startTime = new Date(sessionDetail.startTime);
      const endTime = new Date(sessionDetail.lastActivity);
      const duration = endTime.getTime() - startTime.getTime();
      const durationMins = Math.round(duration / 60000);

      return (
        <div className="space-y-6">
          {/* Back Button & Header */}
          <div className="flex items-center gap-4">
            <button
              onClick={onBack}
              className="p-2 rounded-lg transition-colors hover:bg-white/10"
              style={{ color: COLORS.textSecondary }}
            >
              {Icons.arrowLeft}
            </button>
            <div className="flex-1">
              <h1 className="text-xl font-bold" style={{ color: COLORS.text }}>{projectName}</h1>
              <div className="flex items-center gap-3 text-sm" style={{ color: COLORS.textMuted }}>
                <span className="font-mono text-xs">{sessionDetail.sessionId.slice(0, 12)}...</span>
                <span>•</span>
                <span>{startTime.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                <span>•</span>
                <span>{durationMins > 60 ? `${Math.round(durationMins / 60)}h ${durationMins % 60}m` : `${durationMins}m`}</span>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-full" style={{ background: getModelColor(sessionDetail.model) }}></span>
              <span className="font-medium" style={{ color: getModelColor(sessionDetail.model) }}>
                {getModelDisplayName(sessionDetail.model)}
              </span>
            </div>
          </div>

          {/* Stats Cards */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div className="card p-4 text-center">
              <div className="text-xs uppercase tracking-wider mb-2" style={{ color: COLORS.textMuted }}>Messages</div>
              <div className="text-2xl font-bold" style={{ color: COLORS.text }}>{sessionDetail.messages.length}</div>
            </div>
            <div className="card p-4 text-center">
              <div className="text-xs uppercase tracking-wider mb-2" style={{ color: COLORS.blue }}>Input/Context</div>
              <div className="text-2xl font-bold" style={{ color: COLORS.blue }}>{formatNumber(sessionDetail.totalInputTokens)}</div>
            </div>
            <div className="card p-4 text-center">
              <div className="text-xs uppercase tracking-wider mb-2" style={{ color: COLORS.purple }}>Output</div>
              <div className="text-2xl font-bold" style={{ color: COLORS.purple }}>{formatNumber(sessionDetail.totalOutputTokens)}</div>
            </div>
            <div className="card p-4 text-center">
              <div className="text-xs uppercase tracking-wider mb-2" style={{ color: COLORS.green }}>Cache Read</div>
              <div className="text-2xl font-bold" style={{ color: COLORS.green }}>{formatNumber(sessionDetail.totalCacheReadTokens)}</div>
            </div>
            <div className="card p-4 text-center">
              <div className="text-xs uppercase tracking-wider mb-2" style={{ color: COLORS.amber }}>Cache Write</div>
              <div className="text-2xl font-bold" style={{ color: COLORS.amber }}>{formatNumber(sessionDetail.totalCacheWriteTokens)}</div>
            </div>
          </div>

          {/* Context Growth Chart */}
          {contextChartOption && (
            <div className="card p-5">
              <div className="section-header mb-4">
                <span style={{ color: COLORS.coral }}>{Icons.trendingUp}</span>
                <div>
                  <h2 className="section-title">Context Growth</h2>
                  <p className="section-desc">How context window grows through the conversation</p>
                </div>
              </div>
              <Chart option={contextChartOption} height={280} />
            </div>
          )}

          {/* Messages Table */}
          <div className="card overflow-hidden">
            <div className="p-5 border-b" style={{ borderColor: COLORS.borderSubtle }}>
              <div className="section-header">
                <span style={{ color: COLORS.coral }}>{Icons.messageSquare}</span>
                <div>
                  <h2 className="section-title">Message Details</h2>
                  <p className="section-desc">Token breakdown for each message in the conversation</p>
                </div>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr style={{ background: COLORS.surface2 }}>
                    <th className="text-left p-3 font-medium" style={{ color: COLORS.textSecondary }}>#</th>
                    <th className="text-left p-3 font-medium" style={{ color: COLORS.textSecondary }}>Type</th>
                    <th className="text-left p-3 font-medium" style={{ color: COLORS.textSecondary }}>Time</th>
                    <th className="text-right p-3 font-medium" style={{ color: COLORS.blue }}>Input</th>
                    <th className="text-right p-3 font-medium" style={{ color: COLORS.purple }}>Output</th>
                    <th className="text-right p-3 font-medium" style={{ color: COLORS.green }}>Cache Read</th>
                    <th className="text-right p-3 font-medium" style={{ color: COLORS.amber }}>Cache Write</th>
                    <th className="text-right p-3 font-medium" style={{ color: COLORS.textSecondary }}>Context</th>
                    <th className="text-left p-3 font-medium" style={{ color: COLORS.textSecondary }}>Details</th>
                  </tr>
                </thead>
                <tbody>
                  {sessionDetail.messages.map((msg, idx) => {
                    const time = msg.timestamp ? new Date(msg.timestamp) : null;
                    const isUser = msg.type === 'user';

                        <td className="p-3 text-right font-mono" style={{ color: msg.inputTokens > 0 ? COLORS.blue : COLORS.textMuted }}>

                        <td className="p-3 text-right font-mono" style={{ color: msg.cacheReadTokens > 0 ? COLORS.green : COLORS.textMuted }}>

                        <td className="p-3 text-right font-mono" style={{ color: msg.cacheWriteTokens > 0 ? COLORS.amber : COLORS.textMuted }}>
                          {msg.cacheWriteTokens > 0 ? formatNumber(msg.cacheWriteTokens) : '-'}
                        </td>
                        <td className="p-3 text-right">
                          {hasTokens && (
                            <span className="font-mono text-xs px-2 py-1 rounded" style={{ background: COLORS.surface3, color: COLORS.text }}>

                        <td className="p-3">

                            {msg.preview && (

                  {formatNumber(sessionDetail.totalInputTokens + sessionDetail.totalOutputTokens)} total

              </div>
            </div>
          </div>
        </div>
      );
    };

    // Pricing data for estimator
    const PRICING_DATA = {
      'claude-opus-4-5-20251101': {
        name: 'Opus 4.5',
        input: 15,
        output: 75,
        cacheRead: 1.875,
        cacheWrite: 18.75,
        color: COLORS.coral
      },
      'claude-sonnet-4-5-20250929': {
        name: 'Sonnet 4.5',
        input: 3,
        output: 15,
        cacheRead: 0.30,
        cacheWrite: 3.75,
        color: COLORS.blue
      },
      'claude-haiku-3-5-20241022': {
        name: 'Haiku 3.5',
        input: 0.80,
        output: 4,
        cacheRead: 0.08,
        cacheWrite: 1,
        color: COLORS.green
      }
    };

    // Price Estimator Tab
    const PriceEstimator = ({ stats }) => {
      const costBreakdown = useMemo(() => {
        const breakdown = [];
        let totalCost = 0;
        let totalInputCost = 0;
        let totalOutputCost = 0;
        let totalCacheReadCost = 0;
        let totalCacheWriteCost = 0;

        for (const [modelId, usage] of Object.entries(stats.modelUsage)) {
          const pricing = PRICING_DATA[modelId] || PRICING_DATA['claude-sonnet-4-5-20250929'];
          const inputCost = (usage.inputTokens / 1_000_000) * pricing.input;
          const outputCost = (usage.outputTokens / 1_000_000) * pricing.output;
          const cacheReadCost = (usage.cacheReadInputTokens / 1_000_000) * pricing.cacheRead;
          const cacheWriteCost = (usage.cacheCreationInputTokens / 1_000_000) * pricing.cacheWrite;
          const modelCost = inputCost + outputCost + cacheReadCost + cacheWriteCost;
          totalCost += modelCost;
          totalInputCost += inputCost;
          totalOutputCost += outputCost;
          totalCacheReadCost += cacheReadCost;
          totalCacheWriteCost += cacheWriteCost;

          // Calculate savings from cache (what it would have cost without cache)
          const cacheReadWithoutDiscount = (usage.cacheReadInputTokens / 1_000_000) * pricing.input;
          const cacheSavings = cacheReadWithoutDiscount - cacheReadCost;

          breakdown.push({
            model: pricing.name || getModelDisplayName(modelId),
            modelId,
            inputTokens: usage.inputTokens,
            outputTokens: usage.outputTokens,
            cacheReadTokens: usage.cacheReadInputTokens,
            cacheWriteTokens: usage.cacheCreationInputTokens,
            inputCost,
            outputCost,
            cacheReadCost,
            cacheWriteCost,
            totalCost: modelCost,
            cacheSavings,
            color: pricing.color || COLORS.textMuted
          });
        }

        // Calculate total savings
        let totalSavings = 0;
        breakdown.forEach(b => totalSavings += b.cacheSavings);

        return {
          breakdown: breakdown.sort((a, b) => b.totalCost - a.totalCost),
          totalCost,
          totalInputCost,
          totalOutputCost,
          totalCacheReadCost,
          totalCacheWriteCost,
          totalSavings
        };
      }, [stats.modelUsage]);

      // Calculate projections based on daily average
      const projections = useMemo(() => {
        const days = stats.dailyActivity?.length || 1;
        const dailyAvg = costBreakdown.totalCost / Math.max(days, 1);
        return {
          daily: dailyAvg,
          weekly: dailyAvg * 7,
          monthly: dailyAvg * 30,
          yearly: dailyAvg * 365
        };
      }, [costBreakdown.totalCost, stats.dailyActivity]);

      // Pie chart for model distribution
      const modelChartOption = useMemo(() => {

            borderColor: COLORS.border,

            type: 'pie',
            radius: ['55%', '80%'],
            center: ['50%', '50%'],
            itemStyle: { borderColor: COLORS.surface1, borderWidth: 3 },
            label: { show: false },
            emphasis: { scale: true, scaleSize: 8 },
            data: costBreakdown.breakdown.map(b => ({

              value: b.totalCost,
              itemStyle: { color: b.color }
            }))

        };

            trigger: 'axis',
            backgroundColor: COLORS.surface2,

            textStyle: { color: COLORS.text }
          },

          xAxis: {
            type: 'category',
            data: ['Input', 'Output', 'Cache Read', 'Cache Write'],

            axisTick: { show: false }
          },

            type: 'value',
            axisLine: { show: false },

          },

            barWidth: 40,
            itemStyle: {
              borderRadius: [6, 6, 0, 0],
              color: (params) => {

                return colors[params.dataIndex];
              }

            data: [

              costBreakdown.totalOutputCost,
              costBreakdown.totalCacheReadCost,
              costBreakdown.totalCacheWriteCost
            ]
          }]
        };

              {Icons.trendingUp}

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">

                  </tr>
                </thead>
                <tbody>
                  {Object.entries(PRICING_DATA).map(([id, p], idx) => (
                    <tr key={id} className="border-t transition-colors hover:bg-white/5" style={{ borderColor: COLORS.borderSubtle }}>
                      <td className="p-4">
                        <div className="flex items-center gap-3">
                          <span className="w-2 h-2 rounded-full" style={{ background: p.color }}></span>
                          <span className="font-medium" style={{ color: p.color }}>{p.name}</span>

                      </td>
                      <td className="p-4 text-right font-mono" style={{ color: COLORS.text }}>${p.input}</td>
                      <td className="p-4 text-right font-mono" style={{ color: COLORS.text }}>${p.output}</td>
                      <td className="p-4 text-right font-mono" style={{ color: COLORS.textMuted }}>${p.cacheRead}</td>
                      <td className="p-4 text-right font-mono" style={{ color: COLORS.textMuted }}>${p.cacheWrite}</td>

          {/* Detailed Model Breakdown */}
          <div className="card p-6">
            <h3 className="text-sm font-semibold mb-5" style={{ color: COLORS.text }}>Detailed Usage Breakdown</h3>
            <div className="space-y-4">

                const outputPct = totalTokens > 0 ? (b.outputTokens / totalTokens) * 100 : 0;

                          <span className="text-xs" style={{ color: COLORS.textMuted }}>Cache Write</span>
                        </div>
                        <p className="font-semibold" style={{ color: COLORS.text }}>{formatNumber(b.cacheWriteTokens)}</p>
                        <p className="text-xs" style={{ color: COLORS.amber }}>{formatCurrency(b.cacheWriteCost)}</p>
                      </div>
                    </div>

                    {/* Savings callout */}
                    {b.cacheSavings > 0 && (
                      <div className="mt-4 p-3 rounded-lg flex items-center justify-between" style={{ background: COLORS.green + '10', border: `1px solid ${COLORS.green}30` }}>
                        <div className="flex items-center gap-2">
                          <span style={{ color: COLORS.green }}>{Icons.zap}</span>
                          <span className="text-sm" style={{ color: COLORS.green }}>Cache saved you</span>
                        </div>
                        <span className="font-bold" style={{ color: COLORS.green }}>{formatCurrency(b.cacheSavings)}</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // Main App
    const App = () => {
      const { stats, connected } = useTokenData();
      const [activeTab, setActiveTab] = useState('dashboard');
      const [timeRange, setTimeRange] = useState('weekly');
      const [viewMode, setViewMode] = useState('models');
      const [raceViewMode, setRaceViewMode] = useState('race');
      const [selectedProject, setSelectedProject] = useState(null); // { sessions: [], projectName: '' }
      const [selectedSessionId, setSelectedSessionId] = useState(null); // For session detail page

      const lastUpdated = useMemo(() => {
        return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      }, [stats]);

      // Calculate filtered stats based on time range
      const filteredStats = useMemo(() => {
        const now = new Date();
        let cutoffDate = null;

        if (timeRange === 'daily') {
          cutoffDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        } else if (timeRange === 'weekly') {
          cutoffDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
        }

        if (!cutoffDate) {
          // All time
          return {
            sessions: stats.totalSessions,
            messages: stats.totalMessages
          };
        }

        // Filter sessions by the cutoff date
        const filteredSessions = stats.sessions.filter(s =>
          s.lastActivity && new Date(s.lastActivity) >= cutoffDate
        );

        return {
          sessions: filteredSessions.length,
          messages: filteredSessions.reduce((sum, s) => sum + s.messageCount, 0)
        };
      }, [stats.sessions, stats.totalSessions, stats.totalMessages, timeRange]);

      const handleProjectClick = useCallback((sessions, projectName) => {
        setSelectedProject({ sessions, projectName });
      }, []);

      const handleSessionDetailClick = useCallback((sessionId) => {
        setSelectedSessionId(sessionId);
      }, []);

      // If viewing session detail, show the detail page
      if (selectedSessionId) {
        return (
          <div className="min-h-screen p-4 md:p-6 max-w-7xl mx-auto">
            <SessionDetailPage
              sessionId={selectedSessionId}
              onBack={() => setSelectedSessionId(null)}
            />
          </div>
        );
      }

      return (
        <div className="min-h-screen p-4 md:p-6 max-w-7xl mx-auto">
          {/* Header */}
          <div className="flex items-center justify-between mb-8">
            <div className="flex items-center gap-6">
              <div>
                <h1 className="text-lg font-semibold" style={{ color: COLORS.text }}>Token Monitor</h1>
                <p className="text-xs" style={{ color: COLORS.textMuted }}>Claude Code analytics</p>
              </div>
              {/* Tab Navigation */}
              <div className="flex items-center gap-1 p-1 rounded-lg" style={{ background: COLORS.surface2 }}>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`nav-tab ${activeTab === 'dashboard' ? 'nav-tab-active' : 'nav-tab-inactive'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('pricing')}
                  className={`nav-tab ${activeTab === 'pricing' ? 'nav-tab-active' : 'nav-tab-inactive'}`}
                >
                  Price Estimator
                </button>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs" style={{ color: COLORS.textMuted }}>{lastUpdated}</span>
              <span className={`flex items-center gap-2 text-xs px-3 py-1.5 rounded-full font-medium ${
                connected
                  ? ''
                  : ''
              }`} style={{
                background: connected ? 'rgba(91, 189, 114, 0.1)' : 'rgba(232, 138, 138, 0.1)',
                color: connected ? COLORS.green : '#E88A8A',
                border: `1px solid ${connected ? 'rgba(91, 189, 114, 0.2)' : 'rgba(232, 138, 138, 0.2)'}`
              }}>
                <span className={`w-1.5 h-1.5 rounded-full ${connected ? '' : 'pulse'}`}
                  style={{ background: connected ? COLORS.green : '#E88A8A' }} />
                {connected ? 'Live' : 'Reconnecting'}
              </span>
            </div>
          </div>

          {activeTab === 'pricing' ? (
            <PriceEstimator stats={stats} />
          ) : (
            <>
              {/* Stats Cards */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <StatCard
                  title="Total Tokens"
                  value={formatNumber(stats.totalTokens)}
                  subtitle="All time usage"
                  icon={Icons.activity}
                  accent
                />
                <StatCard
                  title="Input"
                  value={formatNumber(stats.inputTokens)}
                  subtitle="Sent to Claude"
                  icon={Icons.arrowUp}
                />
                <StatCard
                  title="Output"
                  value={formatNumber(stats.outputTokens)}
                  subtitle="Generated responses"
                  icon={Icons.arrowDown}
                />
                <StatCard
                  title="Cache Hit"
                  value={`${stats.cacheEfficiency.toFixed(0)}%`}
                  subtitle={`${formatNumber(stats.cacheReadTokens)} saved`}
                  icon={Icons.zap}
                />
              </div>

              {/* Time Range Controls */}
              <div className="flex items-center justify-between mb-6">
                <div className="flex gap-1">
                  {['daily', 'weekly', 'all'].map(range => (
                    <button
                      key={range}
                      onClick={() => setTimeRange(range)}
                      className={`range-btn ${timeRange === range ? 'range-btn-active' : 'range-btn-inactive'}`}
                    >
                      {range === 'daily' ? '7 Days' : range === 'weekly' ? '30 Days' : 'All Time'}
                    </button>
                  ))}
                </div>
                <div className="text-xs" style={{ color: COLORS.textMuted }}>
                  {filteredStats.sessions} sessions • {formatNumber(filteredStats.messages)} messages
                </div>
              </div>

              {/* Timeline Chart */}
              <div className="card p-5 mb-6">
                <SectionHeader
                  icon={Icons.trendingUp}
                  title="Usage Trends"
                  description="Token consumption over time"
                />
                <TokenTimeline
                  dailyModelTokens={stats.dailyModelTokens}
                  dailyActivity={stats.dailyActivity}
                  timeRange={timeRange}
                  viewMode={viewMode}
                  setViewMode={setViewMode}
                />
              </div>

              {/* Session Growth Chart */}
              <div className="card p-5 mb-6">
                <SectionHeader
                  icon={Icons.growth}
                  title="Session Token Growth"
                  description="How token usage evolves within a chat"
                />
                <SessionGrowth sessions={stats.sessions} />
              </div>

              {/* Peak Hours */}
              <div className="card p-5 mb-6">
                <SectionHeader
                  icon={Icons.grid}
                  title="Peak Hours"
                  description="When you're most active"
                />
                <PeakHours hourlyActivity={stats.hourlyActivity} />
              </div>

              {/* Project Activity and Model Comparison */}
              <div className="grid lg:grid-cols-3 gap-4 mb-6">
                <div className="lg:col-span-2 card p-5 min-w-0">
                  <SectionHeader
                    icon={Icons.barChart}
                    title="Project Activity"
                    description="Token usage by project"
                  />
                  <SessionTimeline sessions={stats.sessions} timeRange={timeRange} />
                </div>
                <div className="card p-5 min-w-0">
                  <SectionHeader
                    icon={Icons.layers}
                    title="Models"
                    description="Input vs output"
                  />
                  <ModelComparison modelUsage={stats.modelUsage} />
                </div>
              </div>

              {/* Session Race */}
              <div className="card p-5 mb-6 min-w-0">
                <SectionHeader
                  icon={Icons.race}
                  title="Session Race"
                  description="Watch sessions grow in real-time"
                />
                <SessionRace sessions={stats.sessions} viewMode={raceViewMode} setViewMode={setRaceViewMode} />
              </div>

              {/* Sessions */}
              <div className="card p-5">
                <SectionHeader
                  icon={Icons.clock}
                  title="Recent Sessions"
                  description="Click a session for message details, or the chart icon for progression"
                />
                <SessionList
                  sessions={stats.sessions}
                  onProjectClick={handleProjectClick}
                  onSessionClick={handleSessionDetailClick}
                />
              </div>

              {/* Project Progression Modal */}
              <Modal isOpen={selectedProject !== null} onClose={() => setSelectedProject(null)}>
                {selectedProject && (
                  <SessionProgressionModal
                    sessions={selectedProject.sessions}
                    projectName={selectedProject.projectName}
                    onClose={() => setSelectedProject(null)}
                  />
                )}
              </Modal>
            </>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
